name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      - name: Test server
        working-directory: server
        run: go test -race ./...

  apk:
    runs-on: ubuntu-latest
    needs: test-server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME"/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true

      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare release keystore
        id: keystore
        env:
          KS_B64: ${{ secrets.SCREENLIMIT_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            KS_PATH="$RUNNER_TEMP/release.jks"
            printf '%s' "$KS_B64" | base64 -d > "$KS_PATH"
            echo "path=$KS_PATH" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release APKs
        env:
          SCREENLIMIT_KEYSTORE: ${{ steps.keystore.outputs.path }}
          SCREENLIMIT_KEYSTORE_PASSWORD: ${{ secrets.SCREENLIMIT_KEYSTORE_PASSWORD }}
          SCREENLIMIT_KEY_ALIAS: ${{ secrets.SCREENLIMIT_KEY_ALIAS }}
          SCREENLIMIT_KEY_PASSWORD: ${{ secrets.SCREENLIMIT_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease :admin:assembleRelease --no-daemon

      - name: Collect
        id: collect
        run: |
          APPV=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          ADMV=$(grep -oP 'versionName = "\K[^"]+' admin/build.gradle.kts)
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk   "dist/screenlimit-v${APPV}.apk"
          cp admin/build/outputs/apk/release/admin-release.apk "dist/screenlimit-admin-v${ADMV}.apk"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: apks-${{ github.sha }}
          path: dist/*.apk
          if-no-files-found: error

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
